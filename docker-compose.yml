# Brings up the whole stack with one command:  docker compose up --build
#
# The app waits for Postgres to pass its healthcheck before starting, and the app
# has its own healthcheck, so `docker compose up` converges to a working system.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/wallet
      DATABASE_USERNAME: wallet
      DATABASE_PASSWORD: wallet
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  db-data:
